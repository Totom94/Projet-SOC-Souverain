version: "3"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - WEBHOOK_URL=http//IP:5678/
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: